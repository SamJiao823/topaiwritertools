<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face{font-family:'Fraunces';font-style:normal;font-weight:700;font-display:block;src:url('file:///Users/apple/Documents/trae_projects/topaiwritingtools/assets/fonts/fraunces-normal-700-1.woff2') format('woff2')}
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:400px; height:400px; overflow:hidden; }
  body {
    background:#0a0a0b;
    display:flex; align-items:center; justify-content:center;
  }
  .card {
    width:360px; height:360px; border-radius:88px;
    background:
      radial-gradient(120% 120% at 12% 8%, rgba(255,255,255,.16) 0%, transparent 45%),
      radial-gradient(130% 130% at 88% 92%, rgba(16,185,129,.45) 0%, transparent 55%),
      linear-gradient(140deg, #7c3aed 0%, #5b21b6 55%, #0f172a 140%);
    position:relative;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.2),
      0 30px 60px rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center;
  }
  .card::after {
    content:''; position:absolute; inset:10px; border-radius:78px;
    border:1px solid rgba(255,255,255,.14);
    pointer-events:none;
  }
  .mono {
    font-family:'Fraunces', serif; font-weight:700;
    font-size:150px; line-height:1; letter-spacing:-.015em;
    color:#ffffff;
    text-shadow:0 6px 24px rgba(0,0,0,.35);
    margin-top:-8px;
  }
  .check {
    position:absolute; right:34px; bottom:34px;
    width:84px; height:84px; border-radius:50%;
    background:linear-gradient(135deg, #34d399, #10b981);
    display:flex; align-items:center; justify-content:center;
    font-size:52px; color:#052e1b; font-weight:900;
    box-shadow:0 10px 24px rgba(16,185,129,.5);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mono">TW</div>
    <div class="check">✓</div>
  </div>
</body>
</html>
